name: Spotify Sync

on:
  schedule:
    # 毎時17分に実行
    - cron: "17 * * * *"

  # GitHub上から手動実行も可能
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Spotify history
        run: |
          curl --fail \
            --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SPOTIFY_SYNC_URL }}"